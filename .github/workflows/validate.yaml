name: Validate data

on:
  pull_request::
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: 
          node-version:  24.21.0
        
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate data
        run: bun run validate

      - name: Validator rejects invalid fixtures
        run: |
          if bun run validate -- test/fixtures/invalid-data/data; then
            echo "Expected the invalid fxtures to fail validation, but they passed"
            exit 1
          fi