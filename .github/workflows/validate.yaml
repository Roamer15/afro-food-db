name: Validate data

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate data
        run: bun run validate

      # Guards the validator itself: the fixtures in test/fixtures/invalid-data are
      # deliberately broken, so a passing run here means the validator has stopped
      # catching things. NO_ANNOTATIONS keeps these expected failures from showing up
      # as error annotations on the pull request.
      - name: Validator rejects invalid fixtures
        env:
          NO_ANNOTATIONS: '1'
        run: |
          if output=$(bun run validate -- test/fixtures/invalid-data/data 2>&1); then
            echo "Expected the invalid fixtures to fail validation, but they passed."
            echo "$output"
            exit 1
          fi
          echo "$output"
          if ! grep -qF '12 problem(s) found.' <<<"$output"; then
            echo "Expected exactly 12 problems from the fixtures."
            exit 1
          fi
