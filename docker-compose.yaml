services:
  db:
    image: postgres:17.2-bookworm
    restart: unless-stopped
    env_file: 
      .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - afro_food_data:/var/lib/postgresql/data

volumes:
  afro_food_data:
    driver: local